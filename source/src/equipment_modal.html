<div class="modal" id="equipmentModal"><div class="modal-card" style="width:min(860px,100%)"><div class="modal-head"><div><h2 id="equipmentModalTitle">Добавить оборудование</h2><div class="mini" id="equipmentModalSub">Срок службы и стоимость нужны, чтобы считать износ и текущую цену</div></div><button class="btn secondary" onclick="closeModal('equipmentModal')">✕</button></div><div class="form-grid"><div class="field"><label>Название</label><input id="equipmentName" list="equipmentTypeList" placeholder="Например, фритюрница двухванная"></div><div class="field"><label>Инвентарный номер</label><input id="equipmentCode" placeholder="MC-FR-003"></div><div class="field"><label>Филиал</label><select id="equipmentBranch" onchange="syncEquipmentResponsible()"></select></div><div class="field"><label>Зона</label><select id="equipmentZone"><option>Кухня</option><option>Бар</option><option>Касса</option><option>Склад</option><option>Зал</option><option>Цех / производство</option></select></div><div class="field"><label>Ответственный</label><select id="equipmentResponsible"></select></div><div class="field"><label>Производитель / модель</label><input id="equipmentModel" placeholder="Например, Gastrorag DF-20"></div><div class="field"><label>Дата покупки</label><input id="equipmentDate" type="date"></div><div class="field"><label>Цена покупки, сум</label><input id="equipmentPrice" type="number" min="0" step="10000" placeholder="0"></div><div class="field"><label>Срок службы, лет</label><input id="equipmentLife" type="number" min="1" max="30" step="0.5" value="5"></div><div class="field"><label>Гарантия до</label><input id="equipmentWarranty" type="date"></div><div class="field"><label>Последнее обслуживание</label><input id="equipmentService" type="date"></div><div class="field"><label>Обслуживание каждые, мес.</label><input id="equipmentServiceEvery" type="number" min="0" max="36" step="1" value="3"></div><div class="field"><label>Состояние</label><select id="equipmentStatus"><option>Работает</option><option>Требует обслуживания</option><option>На ремонте</option><option>Не работает</option><option>Списано</option></select></div><div class="field"><label>Предварительный расчёт</label><input id="equipmentPreview" disabled value="—"></div><div class="field full"><label>Комментарий</label><textarea id="equipmentNote" rows="2" placeholder="Особенности, последние ремонты, что заменили..."></textarea></div></div><datalist id="equipmentTypeList"></datalist><div class="modal-actions"><button class="btn secondary" onclick="closeModal('equipmentModal')">Отмена</button><button class="btn primary" onclick="saveEquipment()">Сохранить</button></div></div></div>
